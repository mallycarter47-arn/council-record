# The public Council Record search site.
app = "council-record"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
