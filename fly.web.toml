# The public Civic Memory search site (formerly council-record.fly.dev).
app = "civic-memory"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

# Search counts for the private /stats page (web/lib/stats.ts). The council
# database stays baked into the image; only stats.db lives here.
[mounts]
  source = "civic_memory_stats"
  destination = "/data"

[env]
  STATS_DB = "/data/stats.db"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
